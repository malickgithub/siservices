<style>

.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.2rem;text-decoration:none;letter-spacing:.02em}

.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font:600 1rem "Instrument Sans",sans-serif;text-decoration:none;padding:13px 22px;border-radius:6px;border:0;min-height:48px;cursor:pointer}

.btn.ghost:hover{border-color:var(--accent)}
.banner{background:var(--accent);color:var(--accent-ink);font-size:.85rem;text-align:center;padding:6px 12px}
.hero{background:radial-gradient(120% 90% at 85% 0%,#1b2733,#07090c 68%);color:#eef3f6;overflow:hidden}
.hero .wrap{display:grid;gap:20px;padding-top:56px}
.hero h1{font-size:clamp(2.3rem,7vw,4.6rem);max-width:13ch}
.hero p{max-width:48ch;color:#b8c9d4;margin:16px 0 26px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.hero img{width:100%;aspect-ratio:2/1;max-height:480px;object-fit:cover;border-radius:10px;display:block;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.note{font-size:.8rem;color:#8fa6b3;margin:0 0 16px}
section{padding:64px 0}
h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.filters{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin:24px 0 14px}
.filters .full{grid-column:1/-1}

label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
select,input{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:11px 10px;font:inherit;min-height:46px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;padding:8px}
.grid{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;width:100%}

.ph{aspect-ratio:3/2;background:linear-gradient(180deg,var(--ph1),var(--ph2));position:relative;display:grid;place-items:center}
.ph svg{width:80%;height:auto}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--muted);font-size:.75rem;padding:3px 8px;border-radius:4px;border:1px solid var(--line)}
.tag.s{left:auto;right:10px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
.tag.sold{background:#6b7782;color:#fff}
.body{padding:14px 16px 18px;display:grid;gap:4px}
.body h3{font-size:1.15rem}
.meta{color:var(--muted);font-size:.88rem}

.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.three{display:grid;gap:24px}

.alt{background:var(--surface);border-block:1px solid var(--line)}

.cta dt{color:#8fa6b3}.cta dd{margin:0}

.side{width:min(300px,86vw);transform:translateX(-100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility 0s .35s}

/* ===== Curseur pneu ===== */
html.tire,html.tire *{cursor:none!important}

#tire{position:fixed;inset:auto;left:0;top:0;margin:0;padding:0;border:0;background:none;overflow:visible;width:36px;height:36px;pointer-events:none;z-index:99999;opacity:0;transition:opacity .2s}
#tire.on{opacity:1}
.t-in{width:100%;height:100%;transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.t-in svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#tire.hot .t-in{transform:scale(1.45)}
#tire.down .t-in{transform:scale(.8)}
#tire.hot.down .t-in{transform:scale(1.2)}

@media(prefers-reduced-motion:no-preference){
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes roll{from{transform:translateX(0) rotate(0)}to{transform:translateX(190px) rotate(640deg)}}
.road svg{animation:roll 8s ease-in-out infinite alternate}
.side nav a:hover{transform:translateX(4px)}
@media(min-width:901px){.side .logo{animation:slideIn .5s backwards}.side nav a{animation:slideIn .5s calc(var(--n)*70ms + .1s) cubic-bezier(.2,.7,.2,1) backwards}}
@media(max-width:900px){body.side-open .side nav a{animation:slideIn .4s calc(var(--n)*60ms + .1s) cubic-bezier(.2,.7,.2,1) backwards}}
}

/* ===== Voiture qui roule (accueil) ===== */
.scene{position:relative;height:88px;margin-top:10px;overflow:hidden}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:#10161c;border-top:2px solid var(--line)}
.lane{position:absolute;left:0;right:0;bottom:5px;height:3px;z-index:1;background:linear-gradient(90deg,#3a4651 28px,transparent 28px) 0 0/56px 3px repeat-x}
.car{position:absolute;left:0;bottom:14px;width:150px;height:56px;transform:translateX(40px)}
.cb{position:relative;width:150px;height:56px}
.cb>svg{display:block;width:150px;height:56px}
.cb .w{position:absolute;top:32px;width:24px;height:24px}
@media(prefers-reduced-motion:no-preference){
@keyframes drive{from{transform:translateX(-180px)}to{transform:translateX(calc(100vw + 30px))}}
@keyframes bump{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lane{to{background-position-x:-56px}}
.car{animation:drive 9s linear infinite}
.cb{animation:bump .35s ease-in-out infinite alternate}
.cb .w{animation:spin .45s linear infinite}
.lane{animation:lane .35s linear infinite}
}

const im=v=>`<img src="${IM[v.slug]||"images/"+v.slug+".jpg"}" alt="${v.brand} ${v.model} ${v.year}" loading="lazy" onerror="this.remove()">`;
function applyLang(){
const t=T[lang];document.documentElement.lang=lang;
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
$("#lang").textContent=lang==="fr"?"EN":"FR";$("#close").textContent=t.close;
$("#wa").textContent=t.wa;$("#wa").href="https://wa.me/221000000000?text="+encodeURIComponent(t.wag);
$("#q").placeholder=t.fSearch;
const fill=(id,vals,lab,all)=>{const s=$(id),cur=s.value;s.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option value="${v}">${lab(v)}</option>`).join("");s.value=cur};
fill("#fcat",[...new Set(V.map(v=>v.cat))],v=>t.cat[v],t.all);
fill("#fbrand",[...new Set(V.map(v=>v.brand))].sort(),v=>v,t.allm);
fill("#ffuel",["essence","diesel"],v=>t.fuel[v],t.allm);
fill("#ftrans",["auto","manuelle"],v=>t.trans[v],t.allm);
const so=$("#fsort");so.innerHTML=[["f",t.sf],["pa",t.sa],["pd",t.sd],["y",t.sy]].map(a=>`<option value="${a[0]}">${a[1]}</option>`).join("");so.value=F.sort;
$("#heroImg").src=IM.hero;
document.title="GALSEN AUTO – "+(lang==="fr"?"Vente de véhicules à Dakar":"Vehicles for sale in Dakar");
list()}
function list(){
const t=T[lang],q=F.q.trim().toLowerCase();
let r=V.filter(v=>(!F.cat||v.cat===F.cat)&&(!F.brand||v.brand===F.brand)&&(!F.fuel||v.fuel===F.fuel)&&(!F.trans||v.trans===F.trans)&&(!q||(v.brand+" "+v.model+" "+v.year).toLowerCase().includes(q)));
r.sort({f:(a,b)=>b.feat-a.feat||b.year-a.year,pa:(a,b)=>a.price-b.price,pd:(a,b)=>b.price-a.price,y:(a,b)=>b.year-a.year}[F.sort]);
$("#count").textContent=t.res(r.length);$("#empty").hidden=r.length>0;$("#list").hidden=!r.length;
$("#list").innerHTML=r.map((v,i)=>`<button class="card" style="--i:${Math.min(i,8)}" data-s="${v.slug}"><div class="ph">${im(v)}<span class="tag">${t.dm}</span><span class="tag s ${v.status==="sold"?"sold":""}">${t.st[v.status]}</span>${sil(v.cat,HEX[v.color])}</div><div class="body"><h3>${v.brand} ${v.model}</h3><div class="meta">${v.year} · ${km(v.km)} · ${t.fuel[v.fuel]}</div><div class="price">${price(v.price)}</div></div></button>`).join("")}
function open(slug){
const v=V.find(x=>x.slug===slug),t=T[lang],n=v.brand+" "+v.model+" "+v.year;
$("#dph").innerHTML=im(v)+`<span class="tag">${t.dm}</span>`+sil(v.cat,HEX[v.color]);
$("#dinfo").innerHTML=`<h3 id="dt">${v.brand} ${v.model}</h3><div class="price">${price(v.price)}</div><dl class="specs"><dt>${t.year}</dt><dd>${v.year}</dd><dt>${t.km}</dt><dd>${km(v.km)}</dd><dt>${t.fCat}</dt><dd>${t.cat[v.cat]}</dd><dt>${t.fFuel}</dt><dd>${t.fuel[v.fuel]}</dd><dt>${t.fTrans}</dt><dd>${t.trans[v.trans]}</dd><dt>${t.color}</dt><dd>${t.col[v.color]}</dd><dt>${lang==="fr"?"Statut":"Status"}</dt><dd>${t.st[v.status]}</dd></dl><p class="meta">${t.desc(n)}</p><div class="acts"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/221000000000?text=${encodeURIComponent(t.wam(n))}">${t.wa}</a><a class="btn ghost" href="tel:+221000000000">${t.call}</a></div>`;
$("#dlg").showModal();window.__tirePromote&&window.__tirePromote()}
$("#list").addEventListener("click",e=>{const c=e.target.closest("[data-s]");if(c)open(c.dataset.s)});
$("#close").onclick=()=>$("#dlg").close();
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
$("#lang").onclick=()=>{lang=lang==="fr"?"en":"fr";try{localStorage.setItem("ga-lang",lang)}catch(e){}applyLang()};
const sideOpen=o=>{document.body.classList.toggle("side-open",o);$("#menu").setAttribute("aria-expanded",o)};
$("#menu").onclick=()=>sideOpen(!document.body.classList.contains("side-open"));
$("#scrim").onclick=()=>sideOpen(false);
$("#nav").addEventListener("click",e=>{if(e.target.closest("a"))sideOpen(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")sideOpen(false)});
[["#q","q"],["#fcat","cat"],["#fbrand","brand"],["#ffuel","fuel"],["#ftrans","trans"],["#fsort","sort"]].forEach(([s,k])=>$(s).addEventListener("input",e=>{F[k]=e.target.value;list()}));
const rs=()=>{Object.assign(F,{q:"",cat:"",brand:"",fuel:"",trans:"",sort:"f"});["#q","#fcat","#fbrand","#ffuel","#ftrans"].forEach(s=>$(s).value="");$("#fsort").value="f";list()};
$("#reset").onclick=rs;$("#reset2").onclick=rs;
applyLang();
if("IntersectionObserver" in window&&matchMedia("(prefers-reduced-motion:no-preference)").matches){
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll("#catalogue h2,.filters,#apropos h2,#apropos .wrap>p,.three>div,.cta .wrap").forEach(e=>{e.classList.add("rv");io.observe(e)})}

/* Scrollspy + barre de progression */
(()=>{const links=[...document.querySelectorAll("#nav a")];
const mark=id=>links.forEach(a=>{const on=a.getAttribute("href")==="#"+id;a.classList.toggle("on",on);on?a.setAttribute("aria-current","true"):a.removeAttribute("aria-current")});
mark("accueil");
if("IntersectionObserver" in window){const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)mark(e.target.id)}),{rootMargin:"-40% 0px -55% 0px"});
links.forEach(a=>{const t=document.querySelector(a.getAttribute("href"));t&&so.observe(t)})}
const p=$("#prog");let tk=false;
const up=()=>{const h=document.documentElement.scrollHeight-innerHeight;p.style.transform="scaleX("+(h>0?Math.min(1,scrollY/h):0)+")";tk=false};
addEventListener("scroll",()=>{if(!tk){tk=true;requestAnimationFrame(up)}},{passive:true});up()})();
/* Curseur pneu */
(()=>{if(!matchMedia("(hover:hover) and (pointer:fine)").matches)return;
const t=$("#tire");if(!t)return;
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches,pop="showPopover" in t,svg=t.firstElementChild.firstElementChild,R=document.documentElement;
if(!pop)R.classList.add("nopop");
let x=0,y=0,tx=0,ty=0,rot=0,shown=false,run=false;
const promote=()=>{if(!pop)return;try{t.hidePopover()}catch(e){}try{t.showPopover()}catch(e){}};
window.__tirePromote=()=>{if(shown)promote()};
function loop(){const k=calm?1:.22,px=x,py=y;x+=(tx-x)*k;y+=(ty-y)*k;const dx=x-px,dy=y-py;
if(!calm)rot+=((Math.abs(dx)>=Math.abs(dy)?dx:dy)/18)*57.2958;
t.style.transform="translate("+(x-18)+"px,"+(y-18)+"px)";svg.style.transform="rotate("+rot+"deg)";
if(Math.abs(tx-x)>.1||Math.abs(ty-y)>.1)requestAnimationFrame(loop);else run=false}
const go=()=>{if(!run){run=true;requestAnimationFrame(loop)}};
addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;tx=e.clientX;ty=e.clientY;
if(!shown){shown=true;x=tx;y=ty;R.classList.add("tire");promote();t.classList.add("on")}
t.classList.toggle("hot",!!(e.target.closest&&e.target.closest("a,button,select,label,input,[data-s]")));go()},{passive:true});
addEventListener("pointerdown",()=>t.classList.add("down"));
addEventListener("pointerup",()=>t.classList.remove("down"));
R.addEventListener("mouseleave",()=>t.classList.remove("on"));
R.addEventListener("mouseenter",()=>{if(shown)t.classList.add("on")})})();
</script>
